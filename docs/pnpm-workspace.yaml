# docs/ 独立 pnpm 工作区根：避免被仓库根的 pnpm-workspace.yaml 接管，
# 从而能独立安装 vitepress 依赖（与 web/gocronx-admin 相同的隔离方式）。
# 批准依赖的 install 构建脚本，否则 pnpm 10 会以"忽略构建脚本"报错阻断 build。
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  core-js: true

# 安全 override：把 vitepress 构建工具链里有漏洞的传递依赖锁到已修复版本。
# 均为同大版本补丁，不超出 vitepress 1.6.3 支持的范围（vite 仍为 5.x）。
# 注：仍残留的 esbuild / vite 漏洞均为「本地 dev server」专属，已修复版需 vite 6+，
# 但 vitepress 1.6.3 只支持 vite 5，故不强升（静态产物与运行时不受影响）。
overrides:
  rollup: '>=4.59.0'
  picomatch: '>=2.3.2'
  immutable: '>=5.1.5'
  postcss: '>=8.5.10'
  mdast-util-to-hast: '>=13.2.1'
  preact: '>=10.26.10'
  vite: '^5.4.21'
